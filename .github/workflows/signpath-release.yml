# ============================================================
# COCO LAUNCHER - Firma automatica con SignPath
# Corre al publicar un release (o manualmente desde Actions),
# firma el CocoUpdater.exe y vuelve a subirlo firmado.
# ============================================================

name: Sign release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag del release a firmar'
        required: true
        default: 'v1.0.1'

env:
  REPO: ${{ github.repository }}

jobs:
  signing:
    runs-on: windows-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          $t = "${{ github.event.release.tag_name }}"
          if (-not $t) { $t = "${{ inputs.tag }}" }
          "tag=$t" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release download "$env:TAG" -R "$env:REPO" -D ./artifacts -p "*.exe"

      - name: Upload unsigned artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-coco
          path: ./artifacts/CocoUpdater.exe

      - name: Sign with SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          output-artifact-directory: ./signed
          wait-for-completion: true

      - name: Re-upload signed binary
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $signed = Get-ChildItem ./signed -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $signed) { throw "No se encontro el exe firmado" }
          Write-Host "Subiendo $($signed.FullName)"
          gh release upload "$env:TAG" "$($signed.FullName)" -R "$env:REPO" --clobber
