[package]
name = "coco-launcher-2"
version = "0.6.53"
description = "Coco Launcher 2 shell"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "coco_launcher_2_lib"
# Coco only ships for Windows desktop: the mobile staticlib/cdylib were a full extra build each time.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ring = "0.17"
base64 = "0.22"
time = { version = "0.3", features = ["parsing", "formatting"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate", "zstd"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_Security", "Win32_System_JobObjects", "Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi", "Win32_System_IO"] }

# Tests and `tauri dev` never use a debugger: line tables keep panics readable at a fraction of
# the disk, and dependencies carry no debug info at all.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

# Real host-package validation hashes and unpacks many GiB. Keep our own
# code debuggable, but avoid running compression/hash inner loops unoptimized.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

# Keep compiled dependencies, but do not accumulate per-version incremental sessions.
# Disk space takes priority; recompiling Coco itself can take longer.
[profile.release]
incremental = false
