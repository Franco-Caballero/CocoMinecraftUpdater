<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Coco Launcher 2 — Propuesta visual</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="reyna-theme.css">
  <script defer src="catalog-data.js"></script>
  <script defer src="app.js"></script>
</head>
<body data-motion="on">
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegación principal">
      <div class="brand"><div class="brand-mark"><img src="../../reynaico.webp" alt="Reyna"></div><div class="brand-copy"><strong>coco<span class="brand-dot">.</span></strong><small>LAUNCHER 2</small></div></div>
      <div class="sidebar-label">DESCUBRIR</div>
      <nav class="navigation" id="navigation">
        <button class="nav-link active" data-view="home" aria-current="page"><span data-icon="home"></span><span>Inicio</span></button>
        <button class="nav-link" data-view="library"><span data-icon="grid"></span><span>Biblioteca</span><span class="nav-count" id="totalCount"></span></button>
        <button class="nav-link" data-view="activity"><span data-icon="activity"></span><span>Actividad</span></button>
      </nav>
      <div class="sidebar-label second-label">TU ESPACIO</div>
      <nav class="navigation">
        <button class="nav-link" data-view="favorites"><span data-icon="heart"></span><span>Favoritos</span></button>
        <button class="nav-link" data-view="settings"><span data-icon="settings"></span><span>Preferencias</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="instance-status"><span class="status-indicator"></span><span><strong>Diseño conceptual</strong><small>Sin conexión al motor</small></span><span data-icon="info" class="status-info"></span></div>
        <div class="sidebar-footer">COCO / VISTA PREVIA <span>02.11.26</span></div>
      </div>
    </aside>

    <main class="main-content" id="mainContent">
      <header class="topbar">
        <div class="breadcrumb"><span>Coco</span><span class="breadcrumb-divider">/</span><strong id="breadcrumbTitle">Inicio</strong></div>
        <div class="top-actions">
          <div class="search-control"><span data-icon="search"></span><input id="search" type="search" placeholder="Buscar experiencias…" autocomplete="off" aria-label="Buscar experiencias"><kbd>Ctrl K</kbd></div>
          <button class="icon-button" id="motionButton" type="button" aria-label="Activar o desactivar animaciones" title="Activar o desactivar animaciones"><span data-icon="sparkles"></span></button>
          <button class="profile-button" data-view="settings" type="button"><span class="profile-avatar">C</span><span>Jugador local</span><span data-icon="chevron-down"></span></button>
        </div>
      </header>

      <div class="notice" role="status"><span data-icon="flask"></span><span><strong>Vista previa.</strong> Sin instalación real.</span><button id="dismissNotice" aria-label="Ocultar aviso"><span data-icon="x"></span></button></div>
      <div id="pageContent" class="page-content"></div>
    </main>
  </div>

  <div class="overlay" id="overlay" hidden></div>
  <aside class="detail-drawer" id="detailDrawer" role="dialog" aria-modal="true" aria-label="Detalles de experiencia" hidden></aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
